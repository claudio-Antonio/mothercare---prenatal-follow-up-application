server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mothercare_auth}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

mothercare:
  jwt:
    secret: ${MOTHERCARE_JWT_SECRET}
    expiracao-minutos: ${MOTHERCARE_JWT_EXPIRACAO_MINUTOS:60}
