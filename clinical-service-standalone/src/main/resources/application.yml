server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: clinical-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/mothercare_clinical}
    username: ${SPRING_DATASOURCE_USERNAME:mothercare}
    password: ${SPRING_DATASOURCE_PASSWORD:mothercare}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      # Laudos em PDF/imagem tendem a ser pequenos (poucos MB); 10MB dá
      # folga sem deixar o bytea do Postgres inchar demais (ver trade-off
      # documentado em DocumentoClinico.kt).

mothercare:
  jwt:
    secret: ${MOTHERCARE_JWT_SECRET}
