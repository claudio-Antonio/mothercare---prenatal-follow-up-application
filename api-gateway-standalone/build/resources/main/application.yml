server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s

# Requisito RNF03 do TCC: triagem de risco deve responder em < 1,5s.
# O timeout de borda do Gateway é definido com folga (5s) para não
# mascarar lentidão real dos serviços internos durante os testes.

mothercare:
  jwt:
    secret: ${MOTHERCARE_JWT_SECRET:troque-esta-chave-em-producao-mothercare-2026-min-32-bytes}
  routes:
    auth-service: ${MOTHERCARE_ROUTE_AUTH:http://localhost:8081}
    clinical-service: ${MOTHERCARE_ROUTE_CLINICAL:http://localhost:8082}
    scheduling-service: ${MOTHERCARE_ROUTE_SCHEDULING:http://localhost:8083}
# Em desenvolvimento local (fora do Docker), os defaults acima já
# apontam para localhost nas portas de cada serviço. No docker-compose,
# as variáveis MOTHERCARE_ROUTE_* são sobrescritas para o nome do
# serviço no Compose (ex.: http://clinical-service:8082), resolvido
# pela rede interna do Docker — não precisa de Eureka/Consul.
